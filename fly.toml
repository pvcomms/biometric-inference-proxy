app = "biometric-inference-proxy"
primary_region = "sin"  # Singapore — closest to Bangalore

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "3000"
  POLL_INTERVAL_MS = "600000"
